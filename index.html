<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>抽奖工具</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #f4f7ff, #e8ecff);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    .card {
      width: min(960px, 100%);
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 22px 40px rgba(21, 40, 120, 0.15);
      padding: 40px;
    }
    .hidden {
      display: none;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 32px;
      color: #1f2a44;
    }
    p {
      margin: 0 0 24px;
      color: #556079;
      line-height: 1.6;
    }
    button {
      border: none;
      border-radius: 999px;
      padding: 14px 28px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 20px rgba(46, 84, 255, 0.2);
    }
    .primary {
      background: linear-gradient(135deg, #3a63ff, #6a8cff);
      color: #ffffff;
    }
    .secondary {
      background: #eff2ff;
      color: #3a63ff;
    }
    .layout {
      display: grid;
      gap: 24px;
      grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
    }
    textarea {
      width: 100%;
      min-height: 220px;
      resize: vertical;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid #dde2ff;
      font-size: 15px;
      line-height: 1.5;
    }
    .panel {
      background: #f7f8ff;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .result {
      font-size: 24px;
      font-weight: 700;
      color: #2d3a5a;
      padding: 16px;
      background: #ffffff;
      border-radius: 12px;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .history {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 180px;
      overflow: auto;
    }
    .history li {
      padding: 10px 12px;
      background: #ffffff;
      border-radius: 12px;
      color: #4b5675;
      font-size: 14px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
    }
    @media (max-width: 860px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <section id="welcome-section">
      <h1>抽奖工具</h1>
      <p>点击下方的 Hello World 按钮即可进入抽奖界面，开始设置参与名单并抽取幸运者。</p>
      <button id="enter-button" class="primary">Hello World</button>
    </section>

    <section id="lottery-section" class="hidden">
      <h1>开始抽奖</h1>
      <p>输入参与名单，每行一个名字。点击“开始抽奖”随机选出一位幸运者，历史记录会保留在右侧。</p>
      <div class="layout">
        <div>
          <textarea id="participants" placeholder="例如：\n张三\n李四\n王五"></textarea>
          <div class="toolbar">
            <button id="draw-button" class="primary">开始抽奖</button>
            <button id="reset-button" class="secondary">清空结果</button>
          </div>
        </div>
        <aside class="panel">
          <div>
            <strong>本轮结果</strong>
            <div id="result" class="result">等待抽取</div>
          </div>
          <div>
            <strong>历史记录</strong>
            <ul id="history" class="history"></ul>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <script>
    const enterButton = document.getElementById('enter-button');
    const welcomeSection = document.getElementById('welcome-section');
    const lotterySection = document.getElementById('lottery-section');
    const participantsInput = document.getElementById('participants');
    const drawButton = document.getElementById('draw-button');
    const resetButton = document.getElementById('reset-button');
    const result = document.getElementById('result');
    const history = document.getElementById('history');

    const historyItems = [];

    enterButton.addEventListener('click', () => {
      welcomeSection.classList.add('hidden');
      lotterySection.classList.remove('hidden');
    });

    drawButton.addEventListener('click', () => {
      const names = participantsInput.value
        .split('\n')
        .map((name) => name.trim())
        .filter(Boolean);

      if (names.length === 0) {
        result.textContent = '请先输入参与名单';
        return;
      }

      const winner = names[Math.floor(Math.random() * names.length)];
      result.textContent = `🎉 ${winner} 🎉`;
      historyItems.unshift(winner);
      renderHistory();
    });

    resetButton.addEventListener('click', () => {
      result.textContent = '等待抽取';
      historyItems.length = 0;
      renderHistory();
    });

    function renderHistory() {
      history.innerHTML = '';
      historyItems.slice(0, 8).forEach((name, index) => {
        const item = document.createElement('li');
        item.textContent = `${index + 1}. ${name}`;
        history.appendChild(item);
      });
    }
  </script>
</body>
</html>
